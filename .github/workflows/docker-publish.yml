name: Build and publish Docker image

# GATE 9 — builds on every version tag and pushes to GHCR. Deliberately does
# NOT also push a floating `latest` tag: WRAPPER_PROMPT.md explicitly
# forbids `image: latest` in production (docker-compose.yml pins
# eprisi-chat-web to ${EPRISI_CHAT_WEB_TAG}), and publishing `latest`
# anyway would just invite someone to use it later.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.2.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_RC_WS_URL=${{ vars.NEXT_PUBLIC_RC_WS_URL || 'wss://private-chat.eprisi.com/websocket' }}
            NEXT_PUBLIC_RC_PUBLIC_URL=${{ vars.NEXT_PUBLIC_RC_PUBLIC_URL || 'https://private-chat.eprisi.com' }}
