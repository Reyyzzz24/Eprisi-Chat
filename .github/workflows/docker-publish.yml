name: Build and publish Docker image

# GATE 9 — builds on every version tag and pushes to GHCR. Deliberately does
# NOT also push a floating `latest` tag: WRAPPER_PROMPT.md explicitly
# forbids `image: latest` in production (docker-compose.yml pins
# eprisi-chat-web to ${EPRISI_CHAT_WEB_TAG}), and publishing `latest`
# anyway would just invite someone to use it later.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.2.0)"
        required: true

env:
  REGISTRY: ghcr.io
  # Hardcoded rather than derived from `github.repository` — the GitHub
  # repo is named "Eprisi-Chat" (no "-web" suffix), which previously
  # produced ghcr.io/reyyzzz24/eprisi-chat, silently mismatching every
  # reference to ghcr.io/reyyzzz24/eprisi-chat-web in docker-compose.yml,
  # DEPLOY.md, and README.md. Found by trying to actually pull the image
  # Dokploy was failing on and getting a different "does not exist" error
  # than the "denied" Dokploy reported, not by inspection alone.
  IMAGE_NAME: reyyzzz24/eprisi-chat-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # On a tag push, the default ref is already the tag — nothing special
      # needed. On workflow_dispatch, the default ref is whatever branch was
      # selected in the UI, NOT the `tag` input text box; without this
      # explicit `ref`, a manual dispatch would silently build the wrong
      # commit while still labeling the image with the requested tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1,value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_RC_WS_URL=${{ vars.NEXT_PUBLIC_RC_WS_URL || 'wss://private-chat.eprisi.com/websocket' }}
            NEXT_PUBLIC_RC_PUBLIC_URL=${{ vars.NEXT_PUBLIC_RC_PUBLIC_URL || 'https://private-chat.eprisi.com' }}
